        const { useState, useEffect } = React;

        const Icon = ({ name, className }) => {
            const icons = {
                heart: 'heart', mic: 'mic', home: 'home', star: 'star', 'map-pin': 'map-pin', phone: 'phone',
                check: 'check', x: 'x', ship: 'ship', bike: 'bike', search: 'search', map: 'map', utensils: 'utensils',
                key: 'key', music: 'music', anchor: 'anchor', fire: 'flame', menu: 'menu', moon: 'moon', waves: 'waves'
            };
            return <i data-lucide={icons[name] || 'circle'} className={className}></i>;
        };

        const InquiryModal = ({ isOpen, onClose, lineLink, defaultHall }) => {
            if (!isOpen) return null;
            const [formData, setFormData] = useState({ name: '', phone: '', date: '', pax: '', budget: '', hall: defaultHall || '', notes: '' });
            const handleSubmit = (e) => {
                e.preventDefault();
                const textToCopy = `【灣琉民宿詢問單】\n詢問項目：${formData.hall}\n姓名：${formData.name}\n電話：${formData.phone}\n日期：${formData.date}\n人數：${formData.pax}位\n預算：$${formData.budget}/人\n備註：${formData.notes}\n----------------\n請協助確認空房與報價，謝謝！`;
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('需求單已複製！即將為您開啟 Line...');
                    window.open(lineLink, '_blank');
                    onClose();
                } catch (err) { alert('複製失敗，請手動複製後前往 Line'); }
                document.body.removeChild(textArea);
            };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm modal-overlay" onClick={onClose}></div>
                    <div className="bg-white rounded-2xl w-full max-w-md p-6 relative z-10 shadow-2xl modal-content max-h-[90vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><Icon name="x" className="w-6 h-6" /></button>
                        <div className="text-center mb-6"><h3 className="text-2xl font-bold text-gray-800">私訊優惠詢價</h3><p className="text-sm text-gray-500 mt-1">填寫需求後將自動複製</p></div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm font-bold text-gray-700 mb-1">詢問項目</label><input type="text" value={formData.hall} onChange={e => setFormData({...formData, hall: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg bg-gray-50" required /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-bold text-gray-700 mb-1">姓名</label><input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg" required /></div>
                                <div><label className="block text-sm font-bold text-gray-700 mb-1">電話</label><input type="tel" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg" /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-bold text-gray-700 mb-1">日期</label><input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg" required /></div>
                                <div><label className="block text-sm font-bold text-gray-700 mb-1">人數</label><input type="number" value={formData.pax} onChange={e => setFormData({...formData, pax: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg" required /></div>
                            </div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1">預算/人</label><input type="text" value={formData.budget} onChange={e => setFormData({...formData, budget: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg" /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1">備註</label><textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full p-3 border border-gray-200 rounded-lg h-24"></textarea></div>
                            <button type="submit" className="w-full bg-[#06C755] text-white py-3 rounded-xl font-bold text-lg hover:bg-[#05a546] transition-colors shadow-lg flex items-center justify-center gap-2">複製並前往 Line <Icon name="check" className="w-5 h-5" /></button>
                        </form>
                    </div>
                </div>
            );
        };

        const PriceCalculator = ({ config }) => {
            const [season, setSeason] = useState('off_weekday');
            const [pax, setPax] = useState(config.basePaxPerUnit || 2);
            const [unitCount, setUnitCount] = useState(1);
            useEffect(() => {
                if (config.mode === 'multi_unit') {
                    const minUnits = Math.ceil(pax / config.maxPaxPerUnit);
                    if (unitCount < minUnits) setUnitCount(minUnits);
                }
            }, [pax, config.mode, config.maxPaxPerUnit]);
            let totalPrice = 0;
            let note = "";
            const basePrice = config.seasons[season].price;
            if (config.mode === 'multi_unit') {
                const extraPax = Math.max(0, pax - (unitCount * config.basePaxPerUnit));
                const extraP = season.includes('peak') ? config.extraPrice.peakSeason : config.extraPrice.offSeason;
                totalPrice = (unitCount * basePrice) + (extraPax * extraP);
                note = `使用 ${unitCount} 棟 + 加 ${extraPax} 床`;
            } else {
                totalPrice = basePrice + (Math.max(0, pax - config.basePax) * config.extraPrice);
            }
            return (
                <div className="bg-blue-50 p-6 rounded-xl border border-blue-200 mb-8 shadow-sm">
                    <h4 className="font-bold text-lg mb-4 text-blue-800 flex items-center gap-2"><span className="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">?</span>房價快速試算</h4>
                    <div className="space-y-6">
                        <div><label className="block text-sm font-bold text-gray-700 mb-2">1. 入住時段</label><select value={season} onChange={e => setSeason(e.target.value)} className="w-full p-3 border border-blue-200 rounded-lg bg-white">{Object.entries(config.seasons).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label className="block text-sm font-bold text-gray-700 mb-2">2. 總人數 ({pax}人)</label>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setPax(Math.max(2, pax-1))} className="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-xl text-gray-600">-</button>
                                    <div className="flex-1 text-center font-bold text-xl bg-white py-2 rounded-lg border border-gray-200 text-blue-800">{pax} 人</div>
                                    <button onClick={() => setPax(Math.min(36, pax+1))} className="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-xl text-gray-600">+</button>
                                </div>
                            </div>
                            {config.mode === 'multi_unit' && (
                                <div><label className="block text-sm font-bold text-gray-700 mb-2">3. 使用棟數</label>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setUnitCount(Math.max(Math.ceil(pax/4), unitCount-1))} className="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-xl text-gray-600">-</button>
                                        <div className="flex-1 text-center font-bold text-xl bg-white py-2 rounded-lg border border-gray-200 text-blue-800">{unitCount} 棟</div>
                                        <button onClick={() => setUnitCount(Math.min(6, unitCount+1))} className="w-10 h-10 rounded-full bg-white border border-gray-300 flex items-center justify-center font-bold text-xl text-gray-600">+</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="mt-6 pt-4 border-t border-blue-200 flex justify-between items-end">
                        <div className="text-gray-600 text-sm">試算金額<br/><span className="text-xs text-blue-600 font-medium">{note}</span></div>
                        <div className="text-right">
                            <span className="text-3xl font-bold text-red-500">NT$ {totalPrice.toLocaleString()}</span>
                            {unitCount === config.totalUnits && config.mode === 'multi_unit' && (<div className="text-xs text-red-500 font-bold mt-1">※ 全區包棟另有優惠，請參考下方價目表</div>)}
                            <div className="text-xs text-gray-500 mt-1">* 實際價格請加 Line 確認空房</div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isInquiryOpen, setIsInquiryOpen] = useState(false);
            const [inquiryHall, setInquiryHall] = useState('');
            const { info, properties, addOnItems, bbqMenu } = WEBSITE_DATA;

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [activeTab]);

            const navigateTo = (tab) => { setActiveTab(tab); setIsMenuOpen(false); window.scrollTo(0, 0); };
            const openInquiry = (hallName) => { setInquiryHall(hallName); setIsInquiryOpen(true); };

            const Navbar = () => (
                <nav className="fixed top-0 left-0 w-full z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 h-16 flex items-center">
                    <div className="max-w-7xl mx-auto px-4 w-full flex justify-between items-center">
                        <div className="font-bold text-xl cursor-pointer text-blue-600" onClick={() => navigateTo('home')}>{info.brandName}</div>
                        <div className="hidden md:flex space-x-8">
                            <button onClick={() => navigateTo('home')} className={`text-sm font-medium ${activeTab === 'home' ? 'text-blue-600' : 'text-gray-500'}`}>首頁</button>
                            <button onClick={() => navigateTo('comparison')} className={`text-sm font-medium ${activeTab === 'comparison' ? 'text-blue-600' : 'text-gray-500'}`}>房型比較</button>
                            <button onClick={() => navigateTo('packages')} className={`text-sm font-medium ${activeTab === 'packages' ? 'text-blue-600' : 'text-gray-500'}`}>加購項目</button>
                        </div>
                        <div className="md:hidden">
                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full text-gray-800">
                                <span className="font-bold text-sm">選單</span>
                                {isMenuOpen ? <Icon name="x" className="w-5 h-5" /> : <Icon name="menu" className="w-5 h-5" />}
                            </button>
                        </div>
                    </div>
                    {isMenuOpen && (
                        <div className="md:hidden bg-white fixed inset-0 top-16 z-50 p-6 animate-fade-in">
                            <div className="flex flex-col gap-4">
                                <button onClick={() => navigateTo('home')} className="p-4 bg-gray-50 rounded-xl text-lg font-bold text-gray-700 text-left">回首頁</button>
                                <button onClick={() => navigateTo('comparison')} className="p-4 bg-gray-50 rounded-xl text-lg font-bold text-gray-700 text-left">房型設備比較</button>
                                <button onClick={() => navigateTo('packages')} className="p-4 bg-gray-50 rounded-xl text-lg font-bold text-gray-700 text-left">加購行程與烤肉</button>
                            </div>
                        </div>
                    )}
                </nav>
            );

            return (
                <div className="min-h-screen flex flex-col pt-16">
                    <Navbar />
                    <main className="flex-grow">
                        {activeTab === 'home' && (
                            <div className="animate-fade-in">
                                <div className="min-h-screen flex items-center justify-center text-white relative hero-bg py-24" style={{backgroundImage: `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url(${info.heroImage})`}}>
                                    <div className="text-center px-4 w-full max-w-6xl mx-auto">
                                        <h1 className="text-3xl md:text-6xl font-bold mb-4">{info.heroTitle}</h1>
                                        <p className="text-base md:text-xl opacity-90 mb-8">{info.heroSubtitle}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-left">
                                            {properties.map(p => (
                                                <button key={p.id} onClick={() => navigateTo(p.id)} className="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-2xl hover:bg-blue-600 transition-all text-left group">
                                                    <div className="flex justify-between items-start mb-2"><span className="text-xs font-bold text-blue-300 group-hover:text-white uppercase">{p.capacity}</span><Icon name={p.icon} className="w-5 h-5 text-blue-200" /></div>
                                                    <h3 className="text-xl font-bold mb-1">{p.tag}</h3>
                                                    <p className="text-sm opacity-70">查看 {p.name} &rarr;</p>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="py-20 bg-white">
                                    <div className="max-w-7xl mx-auto px-4 text-center">
                                        <h2 className="text-3xl font-bold mb-12">為什麼選擇灣琉？</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-8">
                                            <div className="p-6"><Icon name="ship" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">一條龍套裝</h3></div>
                                            <div className="p-6"><Icon name="utensils" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">星空 BBQ</h3></div>
                                            <div className="p-6"><Icon name="key" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">雙人包棟</h3></div>
                                            <div className="p-6"><Icon name="mic" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">歡唱 KTV</h3></div>
                                            <div className="p-6"><Icon name="waves" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">海景戲水池</h3></div>
                                            <div className="p-6"><Icon name="home" className="w-12 h-12 text-blue-600 mx-auto mb-4"/><h3 className="font-bold">在地管家</h3></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {properties.map(p => activeTab === p.id && (
                            <div key={p.id} className="max-w-7xl mx-auto px-4 py-12 animate-fade-in">
                                <button onClick={() => navigateTo('home')} className="mb-8 text-gray-500 flex items-center gap-2">&larr; 返回首頁</button>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16">
                                    <div className="rounded-3xl overflow-hidden shadow-xl h-[400px]"><img src={p.coverImage} className="w-full h-full object-cover" /></div>
                                    <div>
                                        <div className="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold mb-4">{p.tag}</div>
                                        <h1 className="text-4xl font-bold mb-4">{p.name}</h1>
                                        <p className="text-xl text-blue-600 italic mb-6">"{p.slogan}"</p>
                                        <p className="text-gray-600 mb-8">{p.description}</p>
                                        {p.calcConfig.enabled && <PriceCalculator config={p.calcConfig} />}
                                        <div className="flex gap-4"><button onClick={() => openInquiry(p.name)} className="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold text-lg">立即私訊優惠</button></div>
                                    </div>
                                </div>
                                {p.images.length > 0 && (
                                    <div className="mb-12">
                                        <h3 className="text-2xl font-bold mb-6">空間寫真</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">{p.images.map((img, i) => <img key={i} src={img} className="rounded-2xl w-full aspect-video object-cover" />)}</div>
                                    </div>
                                )}
                            </div>
                        ))}
                        {activeTab === 'comparison' && (
                            <div className="max-w-7xl mx-auto px-4 py-12">
                                <h2 className="text-3xl font-bold text-center mb-12">房型設備比較表</h2>
                                <div className="overflow-x-auto shadow-xl rounded-2xl">
                                    <table className="w-full bg-white text-left border-collapse min-w-[800px]">
                                        <thead><tr className="bg-gray-50"><th className="p-6">比較項目</th>{properties.map(p => <th key={p.id} className="p-6">{p.name}</th>)}</tr></thead>
                                        <tbody className="divide-y">
                                            <tr><td className="p-6 font-bold">適合人數</td>{properties.map(p => <td key={p.id} className="p-6">{p.capacity}</td>)}</tr>
                                            <tr><td className="p-6 font-bold">海景</td>{properties.map(p => <td key={p.id} className="p-6">{p.details.view ? '✔' : '✖'}</td>)}</tr>
                                            <tr><td className="p-6 font-bold">KTV</td>{properties.map(p => <td key={p.id} className="p-6">{p.details.ktv ? '✔' : '✖'}</td>)}</tr>
                                            <tr><td className="p-6 font-bold">烤肉區</td>{properties.map(p => <td key={p.id} className="p-6">{p.details.bbq ? '✔' : '✖'}</td>)}</tr>
                                            <tr><td className="p-6 font-bold">戲水池</td>{properties.map(p => <td key={p.id} className="p-6">{p.details.pool ? '✔' : '✖'}</td>)}</tr>
                                            <tr><td className="p-6 font-bold">麻將</td>{properties.map(p => <td key={p.id} className="p-6">{p.details.mahjong ? '✔' : '✖'}</td>)}</tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        {activeTab === 'packages' && (
                            <div className="max-w-7xl mx-auto px-4 py-12 animate-fade-in">
                                <h2 className="text-3xl font-bold text-center mb-12">超值加購項目</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-16">
                                    {addOnItems.map((item, i) => (
                                        <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border">
                                            <Icon name={item.icon} className="w-8 h-8 text-blue-600 mb-4" />
                                            <h3 className="font-bold text-lg mb-1">{item.title}</h3>
                                            <div className="text-red-500 font-bold mb-2">{item.price} <span className="text-xs text-gray-400 font-normal">{item.unit}</span></div>
                                            <p className="text-sm text-gray-500">{item.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                <h2 className="text-3xl font-bold text-center mb-12">🔥 民宿內烤肉菜單 (需預訂)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {bbqMenu.map((item, i) => (
                                        <div key={i} className="bg-white p-6 rounded-2xl shadow-md border-l-4 border-orange-500">
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="text-xl font-bold">{item.title}</h3>
                                                <span className="text-xl font-bold text-red-500">{item.price}</span>
                                            </div>
                                            <p className="text-sm text-gray-600 leading-relaxed bg-gray-50 p-4 rounded-xl">{item.desc}</p>
                                            <button onClick={() => openInquiry(item.title)} className="mt-4 text-orange-600 font-bold flex items-center gap-1">加入詢價單 &rarr;</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="bg-gray-900 text-white py-12 text-center px-4">
                        <h3 className="text-xl font-bold mb-4">{info.brandName}</h3>
                        <p className="text-gray-400 text-sm mb-2">Line ID: {info.lineId} | 電話: {info.phone}</p>
                        <p className="text-xs text-gray-600">&copy; 2026 灣琉民宿系列. 版權所有</p>
                    </footer>
                    <a href={info.lineLink} target="_blank" className="fixed bottom-6 right-6 z-40 flex items-center gap-2 bg-[#06C755] text-white px-5 py-3 rounded-full shadow-lg"><Icon name="phone" className="w-5 h-5" /><span className="font-bold">聯絡管家</span></a>
                    <InquiryModal isOpen={isInquiryOpen} onClose={() => setIsInquiryOpen(false)} lineLink={info.lineLink} defaultHall={inquiryHall} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
